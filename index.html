<script id="core">
const Core=(function(){
'use strict';
const MIN=60000,DAY=86400000;
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
function newDB(){return {v:1,projects:[],tasks:[],meta:{name:'',currency:'ARS',timer:null}};}
function parseISODur(s){
  if(!s)return null;
  const m=/^P(?:(\d+)D)?(?:T(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?)?$/.exec(String(s).trim());
  if(!m)return null;
  return Math.round((+m[1]||0)*1440+(+m[2]||0)*60+(+m[3]||0)+(+m[4]||0)/60);
}
const hasChildren=(db,t)=>db.tasks.some(x=>x.parentId===t.id);
const kids=(db,id)=>db.tasks.filter(x=>x.parentId===id);
function leafDesc(db,id){
  const out=[];
  (function go(i){kids(db,i).forEach(k=>{if(hasChildren(db,k))go(k.id);else out.push(k);});})(id);
  return out;
}
function dependents(db,id){
  const out=new Set(),q=[id];
  while(q.length){const c=q.pop();db.tasks.forEach(t=>{if(!out.has(t.id)&&(t.preds||[]).some(p=>p.id===c)){out.add(t.id);q.push(t.id);}});}
  return out;
}
function schedule(db,pid){
  const proj=db.projects.find(p=>p.id===pid);
  const startMs=proj&&proj.start!=null?proj.start:Date.now();
  const tasks=db.tasks.filter(t=>t.projectId===pid&&!hasChildren(db,t));
  const byId=new Map(tasks.map(t=>[t.id,t]));
  const succ=new Map(tasks.map(t=>[t.id,[]]));
  const indeg=new Map();
  tasks.forEach(t=>{let n=0;(t.preds||[]).forEach(p=>{if(byId.has(p.id)&&p.id!==t.id){succ.get(p.id).push({id:t.id,type:p.type||'FS',lag:p.lag||0});n++;}});indeg.set(t.id,n);});
  const order=[],q=tasks.filter(t=>indeg.get(t.id)===0).map(t=>t.id);
  while(q.length){const id=q.shift();order.push(id);succ.get(id).forEach(s=>{indeg.set(s.id,indeg.get(s.id)-1);if(indeg.get(s.id)===0)q.push(s.id);});}
  const cyclic=order.length<tasks.length;
  if(cyclic)tasks.forEach(t=>{if(!order.includes(t.id))order.push(t.id);});
  const R={};
  order.forEach(id=>{
    const t=byId.get(id),d=(t.durationMin||0)*MIN;let es=startMs;if(t.startAt!=null&&t.startAt>es)es=t.startAt;
    (t.preds||[]).forEach(p=>{
      const a=R[p.id];if(!a)return;const lag=(p.lag||0)*MIN,ty=p.type||'FS';let c;
      if(ty==='FS')c=a.ef+lag;else if(ty==='SS')c=a.es+lag;else if(ty==='FF')c=a.ef+lag-d;else c=a.es+lag-d;
      if(c>es)es=c;
    });
    R[id]={es,ef:es+d,d};
  });
  let finish=startMs;order.forEach(id=>{if(R[id].ef>finish)finish=R[id].ef;});
  for(let i=order.length-1;i>=0;i--){
    const id=order[i],a=R[id];let lf=finish;
    succ.get(id).forEach(s=>{
      const b=R[s.id];if(!b||b.ls===undefined)return;const lag=s.lag*MIN;let c;
      if(s.type==='FS')c=b.ls-lag;else if(s.type==='SS')c=b.ls-lag+a.d;else if(s.type==='FF')c=b.lf-lag;else c=b.lf-lag+a.d;
      if(c<lf)lf=c;
    });
    a.lf=lf;a.ls=lf-a.d;a.slack=a.ls-a.es;
    const t=byId.get(id);
    a.linked=(t.preds||[]).some(p=>byId.has(p.id))||succ.get(id).length>0;
    a.critical=a.linked&&a.slack<=1000;
  }
  const fine=tasks.some(t=>t.durationMin>0&&t.durationMin<1440);
  return {map:R,start:startMs,finish,cyclic,fine,count:tasks.length};
}
function looseEnds(db,pid){
  const s=schedule(db,pid),tasks=db.tasks.filter(t=>t.projectId===pid&&!hasChildren(db,t));
  const hasPred=new Set();let anyLink=false;
  tasks.forEach(t=>(t.preds||[]).forEach(p=>{hasPred.add(p.id);anyLink=true;}));
  if(!anyLink)return [];
  return tasks.filter(t=>!hasPred.has(t.id)&&s.map[t.id]&&s.map[t.id].ef<s.finish-1000).map(t=>t.name);
}
const isQuick=t=>t.durationMin!=null&&t.durationMin>0&&t.durationMin<=15;
function rank(db,now){
  now=now||Date.now();
  const byId=new Map(db.tasks.map(t=>[t.id,t])),sched={},out=[];
  for(const t of db.tasks){
    if(t.status==='done'||hasChildren(db,t))continue;
    if(t.startAt!=null&&t.startAt>(()=>{const e=new Date(now);e.setHours(23,59,59,999);return e.getTime();})())continue;
    if(!(t.preds||[]).every(p=>{const x=byId.get(p.id);return !x||x.status==='done';}))continue;
    let sc=0,crit=false;
    const blocks=dependents(db,t.id).size;
    let s=null;
    if(t.projectId&&db.projects.some(p=>p.id===t.projectId)){
      if(!sched[t.projectId])sched[t.projectId]=schedule(db,t.projectId);
      s=sched[t.projectId].map[t.id];
    }
    if(s&&s.critical){sc+=3;crit=true;}
    if(blocks>0)sc+=Math.min(blocks,4)*0.6;
    let days=null;
    if(t.due){
      days=Math.ceil((t.due-now)/DAY);
      sc+=days<=0?5:days<=1?4:days<=3?3:days<=7?2:days<=14?1:0;
    }
    if(t.starred)sc+=2;
    if(t.status==='doing')sc+=2.5;
    if(s){if(s.es<=now)sc+=1.5;else if(s.es>now+3*DAY)sc-=3;}
    const quick=isQuick(t);
    out.push({task:t,score:sc,crit,blocks,days,star:!!t.starred,doing:t.status==='doing',quick,proj:t.projectId});
  }
  out.sort((a,b)=>b.score-a.score||(a.task.createdAt||0)-(b.task.createdAt||0));
  return out;
}
function pickOthers(rest){
  const out=[];if(rest[0])out.push(rest[0]);
  const q=rest.find(x=>x.quick&&!out.includes(x));if(q)out.push(q);
  for(const x of rest){if(out.length>=2)break;if(!out.includes(x))out.push(x);}
  return out;
}
function progressOf(tasks){
  let w=0,d=0,rem=0;
  tasks.forEach(t=>{const wt=t.durationMin||30,p=t.status==='done'?100:(t.percent||0);w+=wt;d+=wt*p/100;rem+=wt*(1-p/100);});
  return {pct:w?Math.round(d/w*100):0,remainingMin:Math.round(rem),total:tasks.length,done:tasks.filter(t=>t.status==='done').length};
}
const projectProgress=(db,pid)=>progressOf(db.tasks.filter(t=>t.projectId===pid&&!hasChildren(db,t)));
function complete(db,id,now){const t=db.tasks.find(x=>x.id===id);if(!t)return;t.status='done';t.percent=100;t.doneAt=now||Date.now();}
function reopen(db,id){const t=db.tasks.find(x=>x.id===id);if(!t)return;t.status='todo';t.percent=0;t.doneAt=null;}
function deleteTask(db,id){
  const gone=new Set([id]);(function go(i){kids(db,i).forEach(k=>{gone.add(k.id);go(k.id);});})(id);
  db.tasks=db.tasks.filter(t=>!gone.has(t.id));
  db.tasks.forEach(t=>{t.preds=(t.preds||[]).filter(p=>!gone.has(p.id));});
}
function splitTask(db,id,steps,now){
  const t=db.tasks.find(x=>x.id===id);if(!t||!steps.length)return;
  now=now||Date.now();
  const made=steps.map((s,i)=>({id:uid(),projectId:t.projectId,parentId:t.id,name:s.name,durationMin:s.durationMin==null?null:s.durationMin,status:'todo',percent:0,preds:[],starred:false,resp:'',notes:'',due:null,createdAt:now+i}));
  made.forEach((m,i)=>{m.preds=i===0?(t.preds||[]).map(p=>({...p})):[{id:made[i-1].id,type:'FS',lag:0}];});
  const last=made[made.length-1].id;
  db.tasks.forEach(x=>{if(x.id===t.id)return;(x.preds||[]).forEach(p=>{if(p.id===t.id)p.id=last;});});
  if(t.due){made[made.length-1].due=t.due;}
  t.preds=[];t.durationMin=null;t.status='todo';t.percent=0;
  db.tasks.push(...made);
}
const sinVerbo=n=>!/^\S+(ar|er|ir|ír)\b/i.test(String(n).trim());

function defaultStart(now){const d=new Date(now||Date.now());d.setHours(9,0,0,0);return d.getTime();}
function makeProject(db,key,name,start,now,rowsOver){
  now=now||Date.now();
  const p={id:uid(),name:name||TEMPLATES[key].label,start:start!=null?start:defaultStart(now),currency:db.meta.currency||'ARS',fx:1,fxDate:null,resources:[],createdAt:now};
  db.projects.push(p);
  const rows=rowsOver||(TEMPLATES[key]||TEMPLATES.vacio).rows,groups={},ids=[];
  rows.forEach((r,i)=>{

function parseMSProject(text,DP){
  const doc=new (DP||DOMParser)().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('El archivo no es un XML válido.');
  const root=doc.documentElement;
  if(!root||root.localName!=='Project')throw new Error('No parece un proyecto de MS Project.');
  const ch=(el,tag)=>[...el.children].filter(c=>c.localName===tag);
  const q=(el,tag)=>{const n=ch(el,tag)[0];return n?n.textContent:null;};
  const tasks=[];let empty=0;
  const tn=[...doc.getElementsByTagNameNS('*','Task')].filter(n=>n.parentNode&&n.parentNode.localName==='Tasks');
  const TY={'0':'FF','1':'FS','2':'SF','3':'SS'};
  tn.forEach(tk=>{
    const lvl=+(q(tk,'OutlineLevel')||1),uidv=q(tk,'UID');
    if(lvl===0||uidv==='0')return;
    const name=(q(tk,'Name')||'').replace(/\s+/g,' ').trim();
    if(!name||q(tk,'IsNull')==='1'){empty++;return;}
    tasks.push({uid:uidv,name,durMin:parseISODur(q(tk,'Duration')),percent:+(q(tk,'PercentComplete')||0),level:lvl,
      milestone:q(tk,'Milestone')==='1',summary:q(tk,'Summary')==='1',
      preds:ch(tk,'PredecessorLink').map(l=>({uid:q(l,'PredecessorUID'),type:TY[q(l,'Type')]||'FS',lag:Math.round((+q(l,'LinkLag')||0)/10)}))});
  });
  const res=[];
  const cals=ch(root,'Calendars')[0];
  if(cals)ch(cals,'Calendar').forEach(c=>{if(q(c,'IsBaseCalendar')==='0'){const n=(q(c,'Name')||'').replace(/\s+/g,' ').trim();if(n)res.push(n);}});
  const rs=ch(root,'Resources')[0];
  if(rs)ch(rs,'Resource').forEach(r=>{const n=(q(r,'Name')||'').replace(/\s+/g,' ').trim();if(n&&q(r,'UID')!=='0'&&!res.includes(n))res.push(n);});
  const uids=new Set(tasks.map(t=>t.uid));
  const links=tasks.reduce((a,t)=>a+t.preds.filter(p=>uids.has(p.uid)).length,0);
  const dflt=tasks.filter(t=>t.durMin===1440).length;
  const suggest=(tasks.length>=15&&links<tasks.length*0.3)?'inbox':'project';
  return {name:(q(root,'Name')||'').replace(/\s+/g,' ').trim(),tasks,resources:res,empty,links,placeholderDur:tasks.length>0&&dflt/tasks.length>=0.8,suggest};
}

    db.projects.push(p);pid=p.id;
  }
  const map=new Map(),stack=[],made=[];

/* ---------- AHP (proceso analítico jerárquico) ---------- */
const AHP_RI=[0,0,0.58,0.9,1.12,1.24,1.32,1.41,1.45,1.49];
function ahpPairs(n){const r=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)r.push([i,j]);return r;}
/* comps["i,j"] = +k: i pesa k veces más que j; -k: j pesa k veces más que i; 1: igual */
function ahpMatrix(n,comps){
  const M=Array.from({length:n},()=>Array(n).fill(1));comps=comps||{};
  ahpPairs(n).forEach(([i,j])=>{const v=comps[i+','+j];if(v){const k=Math.abs(v);if(v>0){M[i][j]=k;M[j][i]=1/k;}else{M[i][j]=1/k;M[j][i]=k;}}});
  return M;
}
function ahpPriority(M){
  const n=M.length,g=M.map(r=>Math.pow(r.reduce((a,b)=>a*b,1),1/n)),sum=g.reduce((a,b)=>a+b,0),w=g.map(x=>x/sum);
  let lam=0;for(let i=0;i<n;i++){let t=0;for(let j=0;j<n;j++)t+=M[i][j]*w[j];lam+=t/w[i];}lam/=n;
  const ci=n>2?(lam-n)/(n-1):0,ri=AHP_RI[Math.min(n,10)-1]||1.49,cr=n>2?Math.max(0,ci/ri):0;
  return {w,cr,lam};
}
function ahpWorst(M,w){
  let best=null,dev=1.0001;
  ahpPairs(M.length).forEach(([i,j])=>{const r=M[i][j]/(w[i]/w[j]),d=Math.max(r,1/r);if(d>dev){dev=d;best=[i,j];}});
  return best;
}
function ahpSolve(dec){
  const m=dec.options.length,n=dec.criteria.length,CM=ahpMatrix(n,dec.critComp),C=ahpPriority(CM),local=[],lcr=[];
  for(let c=0;c<n;c++){const M=ahpMatrix(m,(dec.optComp||{})[c]),P=ahpPriority(M);local.push(P.w);lcr.push({cr:P.cr,worst:ahpWorst(M,P.w)});}
  const scores=dec.options.map((_,o)=>C.w.reduce((a,wc,c)=>a+wc*local[c][o],0));
  return {cw:C.w,ccr:C.cr,cworst:ahpWorst(CM,C.w),local,lcr,scores,order:scores.map((_,i)=>i).sort((a,b)=>scores[b]-scores[a])};
}
/* lista plana de comparaciones a preguntar: primero criterios, después las opciones por cada criterio */
function ahpSteps(dec){
  const out=[];ahpPairs(dec.criteria.length).forEach(([i,j])=>out.push({kind:'crit',c:-1,i,j}));
  dec.criteria.forEach((_,c)=>ahpPairs(dec.options.length).forEach(([i,j])=>out.push({kind:'opt',c,i,j})));
  return out;
}
function ahpGet(dec,st){const bag=st.kind==='crit'?dec.critComp:((dec.optComp||{})[st.c]||{});return bag?bag[st.i+','+st.j]:undefined;}
function ahpSet(dec,st,v){
  if(st.kind==='crit'){dec.critComp=dec.critComp||{};dec.critComp[st.i+','+st.j]=v;}
  else{dec.optComp=dec.optComp||{};dec.optComp[st.c]=dec.optComp[st.c]||{};dec.optComp[st.c][st.i+','+st.j]=v;}
}
function ahpMatrixDone(dec,st){
  const n=st.kind==='crit'?dec.criteria.length:dec.options.length,bag=st.kind==='crit'?(dec.critComp||{}):((dec.optComp||{})[st.c]||{});
  return ahpPairs(n).every(([i,j])=>bag[i+','+j]!=null);
}
function ahpMatrixCR(dec,st){
  const n=st.kind==='crit'?dec.criteria.length:dec.options.length,bag=st.kind==='crit'?dec.critComp:((dec.optComp||{})[st.c]);

  let occ=0,cur=null;iv.forEach(x=>{if(!cur||x[0]>cur[1]){if(cur)occ+=cur[1]-cur[0];cur=[x[0],x[1]];}else cur[1]=Math.max(cur[1],x[1]);});if(cur)occ+=cur[1]-cur[0];
  return Math.max(0,(w1-w0)-occ);
}
function capOf(db,ds){const c=availOf(db).cap,k=dateKey(ds),wd=new Date(ds).getDay();
  if(c.exc[k]!=null)return c.exc[k];if(c.byDay[wd]!=null)return c.byDay[wd];return null;}
function capacityMin(db,ds){const f=freeMin(db,ds),c=capOf(db,ds);return c==null?f:Math.min(f,Math.round(c*60));}
function meTasks(db){
  const out=[];
  db.tasks.forEach(t=>{
    if(!t.projectId||t.status==='done'||hasChildren(db,t))return;
    const p=db.projects.find(x=>x.id===t.projectId);if(!p)return;
    const a=(t.assign||[]).find(a=>{const r=(p.resources||[]).find(x=>x.id===a.rid);return r&&r.me;});
    if(a)out.push({t,p,min:Math.round((assignQty(db,t.projectId,a,t)||0)*60)});
  });
  return out;
}
function meItems(db){
  const sch={};
  return meTasks(db).map(x=>{const sc=sch[x.p.id]||(sch[x.p.id]=schedule(db,x.p.id)),s=sc.map[x.t.id];return s?Object.assign(x,{es:s.es,ef:s.ef}):null;}).filter(Boolean);
}
function loadByDay(db,fromMs,days){
  const items=meItems(db),res=[],d0=new Date(fromMs);
  for(let i=0;i<days;i++){
    const ds=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i).getTime(),de=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i+1).getTime();
    let load=0;const list=[];
    items.forEach(x=>{
      if(x.ef<=x.es){if(x.es>=ds&&x.es<de){load+=x.min;list.push(x);}return;}
      const ov=Math.min(x.ef,de)-Math.max(x.es,ds);
      if(ov>0){load+=x.min*ov/(x.ef-x.es);list.push(x);}
    });
    const cap=capacityMin(db,ds);
    res.push({ds,load:Math.round(load),cap,free:freeMin(db,ds),over:Math.round(load)>cap+1,list});
  }
  return res;
}
function suggestDay(db,fromMs,min,horizon){
  const L=loadByDay(db,fromMs,horizon||90);
  for(const d of L)if(d.cap-d.load>=min&&d.cap>0)return d.ds;
  return null;
}
/* tareas mías con horario puntual que pisan un bloque ocupado o protegido */
function blockConflicts(db){

    if(x.ef<=x.es||x.ef-x.es>=1440*60000)return;
    for(let d=new Date(x.es).setHours(0,0,0,0);d<x.ef;d=new Date(new Date(d).getFullYear(),new Date(d).getMonth(),new Date(d).getDate()+1).getTime()){
      blocksOn(db,d).forEach(b=>{
        const b0=d+hm(b.start)*60000,b1=d+hm(b.end)*60000;
        if(Math.min(x.ef,b1)-Math.max(x.es,b0)>0)out.push({t:x.t,b,ds:d});
      });
    }
  });
  return out;
}

/* ---------- recursos y costos ---------- */
const UNITS={u:['u',1,'unidades'],g:['m',1,'g'],kg:['m',1000,'kg'],ml:['v',1,'ml'],l:['v',1000,'l'],mm:['L',0.001,'mm'],cm:['L',0.01,'cm'],m:['L',1,'m'],km:['L',1000,'km'],m2:['A',1,'m²'],m3:['C',1,'m³']};
const STD_EXTRA=['bolsa','caja','rollo','plancha','lata','balde','pack','pieza','tira','par'];
const ulab=u=>UNITS[u]?UNITS[u][2]:(u||'u');
const ufam=u=>UNITS[u]?UNITS[u][0]:'x:'+String(u||'u').toLowerCase();
const convert=(q,from,to)=>{if(from===to)return q;const a=UNITS[from]?UNITS[from]:[ufam(from),1],b=UNITS[to]?UNITS[to]:[ufam(to),1];if(a[0]!==b[0])return null;return q*a[1]/b[1];};
const unitsLike=u=>{const f=ufam(u);const L=Object.keys(UNITS).filter(k=>UNITS[k][0]===f);return L.length?L:[u];};
/* 1 unidad del recurso = eq.q de eq.u (ej.: 1 bolsa = 25 kg) */
function toResUnit(r,q,from){
  const to=r.unit||'u';let x=convert(q,from||to,to);if(x!=null)return x;
  if(r.eq&&+r.eq.q>0){const y=convert(q,from,r.eq.u);if(y!=null)return y/(+r.eq.q);}
  return null;
}
function newResource(name,kind){return {id:uid(),name,kind:kind||'persona',unit:kind==='material'?'u':'',stock:0,price:0,rate:0,me:false};}
function resKind(r){return r.kind||'persona';}
const qmult=t=>(t&&t.perUnit&&t.qty>1)?t.qty:1;
function assignQty(db,pid,a,t){
  const p=db.projects.find(x=>x.id===pid),r=p&&(p.resources||[]).find(x=>x.id===a.rid);if(!r)return null;
  if(resKind(r)==='material'){const q=toResUnit(r,a.qty||0,a.unit||r.unit);return q==null?0:q*qmult(t);}
  return a.qty!=null&&a.qty!==''?a.qty*qmult(t):(t.durationMin||0)/60;
}
function taskCost(db,t){
  const p=db.projects.find(x=>x.id===t.projectId);let plan=(+t.cost||0)*qmult(t);const parts=[];
  if(plan)parts.push({n:'Costo propio',v:plan});
  (t.assign||[]).forEach(a=>{
    const r=p&&(p.resources||[]).find(x=>x.id===a.rid);if(!r)return;
    const q=assignQty(db,t.projectId,a,t);if(q==null)return;
    const v=resKind(r)==='material'?q*(+r.price||0):q*(+r.rate||0);
    if(v){plan+=v;parts.push({n:r.name,v});}
  });
  const real=t.realCost!=null&&t.realCost!==''?+t.realCost:plan;
  return {plan,real,parts};
}
function projectCosts(db,pid){
  let plan=0,spent=0,planDone=0;const byTask=[];
  db.tasks.filter(t=>t.projectId===pid&&!hasChildren(db,t)).forEach(t=>{
    const c=taskCost(db,t);plan+=c.plan;if(t.status==='done'){spent+=c.real;planDone+=c.plan;}
    if(c.plan||c.real)byTask.push({t,plan:c.plan,real:c.real,parts:c.parts});
  });
  const p=db.projects.find(x=>x.id===pid),fx=(p&&+p.fx)||1;
  return {plan,spent,pending:plan-planDone,byTask,fx,planBase:plan*fx,spentBase:spent*fx};
}
function stockInfo(db,pid){
  const p=db.projects.find(x=>x.id===pid);if(!p)return[];
  return (p.resources||[]).filter(r=>resKind(r)==='material').map(r=>{
    let planned=0,used=0;
    db.tasks.filter(t=>t.projectId===pid&&!hasChildren(db,t)).forEach(t=>(t.assign||[]).forEach(a=>{
      if(a.rid!==r.id)return;const q=assignQty(db,pid,a,t)||0;planned+=q;if(t.status==='done')used+=q;}));
    const stock=+r.stock||0;
    return {r,stock,planned,used,real:stock-used,projected:stock-planned,missing:Math.max(0,planned-stock)};
  });
}
function overlaps(db,pid){
  const sc=schedule(db,pid),p=db.projects.find(x=>x.id===pid),out=[];if(!p)return out;
  (p.resources||[]).filter(r=>resKind(r)!=='material').forEach(r=>{
    const its=db.tasks.filter(t=>t.projectId===pid&&t.status!=='done'&&(t.assign||[]).some(a=>a.rid===r.id)&&sc.map[t.id]).map(t=>({t,s:sc.map[t.id]})).filter(x=>x.s.ef>x.s.es).sort((a,b)=>a.s.es-b.s.es);
    for(let i=0;i<its.length;i++)for(let j=i+1;j<its.length;j++){if(its[j].s.es>=its[i].s.ef)break;out.push({r,a:its[i].t,b:its[j].t});}
  });
  return out;
}
function removeResource(db,pid,rid){
  const p=db.projects.find(x=>x.id===pid);if(!p)return;
  p.resources=(p.resources||[]).filter(r=>r.id!==rid);
  db.tasks.forEach(t=>{if(t.projectId===pid&&t.assign)t.assign=t.assign.filter(a=>a.rid!==rid);});
}
const money=(v,cur)=>{try{return new Intl.NumberFormat('es-AR',{style:'currency',currency:cur||'ARS',maximumFractionDigits:v%1?2:0}).format(v);}catch(e){return (cur||'')+' '+Math.round(v);}};

/* ---------- formato ---------- */
function fmtDur(m){

function parseDT(dv,tv){if(!dv)return null;const [y,m,d]=dv.split('-').map(Number);const [hh,mm]=(tv||'09:00').split(':').map(Number);return new Date(y,m-1,d,hh,mm).getTime();}

function viewPert(pid,sc){

  });

  <div class="mut small" style="margin-top:8px">Arrastrá una caja con un dedo para acomodarla; arrastrá el fondo para moverte; pellizcá con dos dedos para acercar o alejar. Las flechas van de lo que hay que terminar a lo que viene después. Borde grueso: ruta crítica. Color: urgencia. Tocá una caja para editarla, o usá «Enlazar tareas».</div>`;

let PERT=null;

const PAL=['#0F766E','#B45309','#2563EB','#9333EA','#BE185D','#4D7C0F'];
function calItems(all){

  pids.forEach(pid=>{
    const sc=Core.schedule(db,pid),color=PAL[Math.max(0,db.projects.findIndex(p=>p.id===pid))%PAL.length];
    db.tasks.filter(t=>t.projectId===pid&&!Core.hasChildren(db,t)).forEach(t=>{
      const s=sc.map[t.id];if(s)items.push({t,pid,color,es:s.es,ef:s.ef,kind:'work',fine:sc.fine});

function weekStrip(){

  WD.forEach(([n,wd],i)=>{

    g+=`<text x="0" y="${y+14}" font-size="12" fill="#5B6166">${n}</text><rect x="${L}" y="${y+2}" width="${W-L}" height="${RH-6}" rx="4" fill="#fff" stroke="#CFC9BA"/>`;
    a.blocks.filter(b=>(b.days||[]).includes(wd)&&Core.hm(b.start)!=null&&Core.hm(b.end)>Core.hm(b.start)).forEach(b=>{
      const x0=Math.max(w0,Core.hm(b.start)),x1=Math.min(w1,Core.hm(b.end));if(x1<=x0)return;

  return `<svg viewBox="0 0 ${W} ${4+7*RH+18}" width="100%" role="img" aria-label="Semana: gris ocupado, verde protegido, blanco libre">${g}${ticks}</svg>`;

    const body=`<div style="font-size:18px;line-height:24px;font-weight:700;padding:0 4px 8px">${crit?'¿Qué pesa más al elegir?':'¿Cuál es mejor en «'+esc(d.criteria[sp.c])+'»?'}</div><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">${card(A,cur>1)}<span style="flex:none;width:28px;text-align:center;font-size:13px;font-weight:700;color:#5B6166">vs</span>${card(B,cur<0)}</div><div style="display:flex;flex-direction:column;gap:8px">${opts}</div><p class="mut small" style="margin:10px 4px 0">${cur!=null?`Eso vale ${Math.abs(cur)} en la escala de Saaty (de 1 a 9). `:''}Respondé con tu intuición: después se puede corregir.</p>`;

  h+=`<div class="sec">Qué importó más</div><div class="card" style="gap:6px;padding:12px">${d.criteria.map((c,ci)=>({c,w:r.cw[ci]})).sort((a,b)=>b.w-a.w).map(x=>`<div style="display:flex;justify-content:space-between"><span>${esc(x.c)}</span><b>${pctS(x.w)}</b></div>`).join('')}</div>`;

}

function readTaskForm(){
  const s=S.sheet,isNew=!s.id,t=isNew?s.draft:taskOf(s.id),L=$('#layer');
  const vv0=id=>{const e=L.querySelector(id);return e?e.value:'';};
  const name=L.querySelector('#tk-name').value.trim();
  if(!name){toast('Poné un nombre.');return;}
  const dv=L.querySelector('#tk-dur').value,unit=L.querySelector('#tk-unit').value;
  const qtyRaw=parseInt(vv0('#tk-qty'),10),qty=qtyRaw>1?qtyRaw:null;
  const per=dv===''?null:Math.max(0,Math.round(parseFloat(dv)*(unit==='d'?1440:unit==='h'?60:1)));
  const dur=per==null?null:per*(qty||1);
  const star=L.querySelector('#tk-star').checked;
  if(star&&!t.starred){
    const n=db.tasks.filter(x=>x.projectId===t.projectId&&x.starred&&x.status!=='done'&&x.id!==t.id).length;

  L.querySelectorAll('[data-pred]').forEach(el=>{

      const lag=parseFloat(el.querySelector('.predx input').value);
      preds.push({id:el.dataset.pred,type:el.querySelector('.predx select').value,lag:isNaN(lag)?0:Math.round(lag*60)});
    }
  });
  const ph=L.querySelector('#tk-phase'),vv=id=>{const e=L.querySelector(id);return e?e.value:'';};
  const assign=[];let bad=null;
  L.querySelectorAll('[data-res]').forEach(el=>{
    if(!el.querySelector('input[type=checkbox]').checked)return;
    const q=el.querySelector('.rq').value,u=el.querySelector('.ru'),r=((projOf(t.projectId)||{}).resources||[]).find(x=>x.id===el.dataset.res);
    if(r&&Core.resKind(r)==='material'&&q==='')bad=r.name;
    assign.push({rid:el.dataset.res,qty:q===''?null:parseFloat(q.replace(',','.')),unit:u?u.value:null});
  });
  if(bad){toast('Poné la cantidad de «'+bad+'».');return;}
  if(L.querySelector('#tk-cost')){t.cost=parseFloat(vv('#tk-cost'))||0;const rc=vv('#tk-real');t.realCost=rc===''?null:(parseFloat(rc)||0);}
  t.assign=assign;
  t.qty=qty;const pu=L.querySelector('#tk-pu');t.perUnit=qty?(pu?pu.checked:true):false;
  t.name=name;t.durationMin=dur;t.due=parseDateVal(L.querySelector('#tk-due').value,true);{const sd=L.querySelector('#tk-sd').value,st=L.querySelector('#tk-st').value;if(sd){const [y,m,d]=sd.split('-').map(Number),[hh,mm]=(st||'00:00').split(':').map(Number);t.startAt=new Date(y,m-1,d,hh||0,mm||0).getTime();}else t.startAt=null;}t.resp=L.querySelector('#tk-resp').value.trim();
  t.starred=star;t.notes=L.querySelector('#tk-notes').value;t.preds=preds;
  if(ph)t.parentId=ph.value||null;
  if(isNew)db.tasks.push(t);

}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
async function shareProject(id){
  const p=projOf(id),pr=Core.projectProgress(db,id),sc=Core.schedule(db,id);
  const open=db.tasks.filter(t=>t.projectId===id&&!Core.hasChildren(db,t)&&t.status!=='done'&&(t.preds||[]).every(q=>{const x=taskOf(q.id);return !x||x.status==='done';})).slice(0,6);
  let txt=`*${p.name}* — ${pr.pct} % (${pr.done} de ${pr.total} hechas)`;
  if(sc.count)txt+=`\nTermina: ${fmtDate(sc.finish,sc.fine)}`;
  if(open.length)txt+='\n\nPróximas:\n'+open.map(t=>`• ${t.name}${t.resp?' ('+t.resp+')':''}`).join('\n');
  try{if(navigator.share){await navigator.share({text:txt});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(txt);toast('Resumen copiado.');}catch(e){download(p.name+'.txt',txt,'text/plain');}
}
function parseSteps(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(min|m|h)\s*$/i.exec(l);
    if(m){const n=parseFloat(m[2].replace(',','.'));return {name:m[1],durationMin:Math.round(/h/i.test(m[3])?n*60:n)};}
    return {name:l,durationMin:null};
  });
}

function act(a,d,el){
  switch(a){
    case 'tab':S.pv=null;S.tab=d.tab;S.link={on:false,from:null};S.wiz=null;S.avail=false;S.dec=null;S.listId=null;S.listsAll=false;S.pid=null;S.view='lista';S.calAll=false;S.sheet=null;S.filter='todas';render();window.scrollTo(0,0);break;
    case 'toggle':{const t=taskOf(d.id);if(!t)break;if(t.status==='done'){Core.reopen(db,d.id);save();render();}else{finishTask(d.id);}break;}
    case 'other':S.offset++;render();break;
    case 'start':startTimer(d.id);break;
    case 'startnext':S.celebrate=null;startTimer(d.id);break;
    case 'closecel':S.celebrate=null;render();break;
    case 'tpause':{const tm=db.meta.timer;if(!tm)break;if(tm.since){tm.acc+=Date.now()-tm.since;tm.since=null;}else tm.since=Date.now();save();drawLayer();break;}
    case 'tdone':finishTask(db.meta.timer.taskId);break;
    case 'texit':{const tm=db.meta.timer;if(tm){const t=taskOf(tm.taskId);const el2=timerLeft().el;if(t)t.spentMin=(t.spentMin||0)+Math.round(el2/60000);}db.meta.timer=null;save();render();break;}
    case 'capture':openCapture();break;
    case 'closesheet':closeSheet();break;
    case 'filter':S.filter=d.f;render();break;
    case 'newproj':S.tab='proyectos';S.pid=null;S.sheet={type:'newproj'};render();break;
    case 'createproj':{
      const L=$('#layer'),key=L.querySelector('#np-tpl').value,name=L.querySelector('#np-name').value.trim();
      const start=parseDT(L.querySelector('#np-date').value,L.querySelector('#np-time').value)||Core.defaultStart();
      const p=Core.makeProject(db,key,name,start,Date.now());if(key==='ironman'){const ev=Core.ecoEventos(ecoRead,todayISO())[0],dt=db.tasks.find(t=>t.projectId===p.id&&/d[ií]a de la carrera/i.test(t.name));if(ev&&dt){const tg=parseDT(ev.fecha,'07:00');if(tg){Core.anchorProject(db,p.id,dt.id,tg);p.name=name||ev.nombre;toast('Armé el proyecto hacia «'+ev.nombre+'» ('+ev.fecha.split('-').reverse().join('/')+').');}}['ironman_semana','ironman_natacion','ironman_t1','ironman_t2'].forEach(k=>Core.newList(db,Core.LIST_TEMPLATES[k].label.replace('Ironman: ',''),p.id,k,Date.now()));}S.pid=p.id;S.sheet=null;S.tab='proyectos';save();render();break;
    }
    case 'openproj':S.pv=null;S.pid=d.id;S.view='lista';S.listId=null;S.calDay=null;render();window.scrollTo(0,0);break;
    case 'backproj':S.pv=null;S.pid=null;S.view='lista';S.listId=null;render();break;
    case 'view':S.view=d.v;S.link={on:false,from:null};render();break;
    case 'pzoom':{const vp=$('#pertvp');if(d.k==='fit')pertFit();else if(d.k==='reset')pertReset();else if(vp){const r=vp.getBoundingClientRect();pertZoomAt(r.left+r.width/2,r.top+r.height/2,d.k==='in'?1.3:1/1.3);}break;}
    case 'plinktoggle':S.link={on:!S.link.on,from:null};render();break;
    case 'plink':{
      const id=d.id;
      if(!S.link.from){S.link.from=id;render();break;}
      if(S.link.from===id){S.link.from=null;render();break;}
      const A=taskOf(S.link.from),B=taskOf(id);S.link.from=null;
      if(!A||!B){render();break;}
      const has=(B.preds||[]).some(q=>q.id===A.id);
      if(has){B.preds=B.preds.filter(q=>q.id!==A.id);save();render();toast('Enlace quitado: «'+A.name+'» ya no va antes de «'+B.name+'».');break;}
      if(Core.dependents(db,B.id).has(A.id)||(A.preds||[]).some(q=>q.id===B.id)){render();toast('Eso haría un círculo: «'+A.name+'» ya depende de «'+B.name+'».');break;}
      B.preds=(B.preds||[]).concat([{id:A.id,type:'FS',lag:0}]);save();render();toast('«'+A.name+'» → «'+B.name+'»');break;}
    case 'listsall':S.listsAll=true;S.tab='proyectos';S.pid=null;render();window.scrollTo(0,0);break;
    case 'listsback':S.listsAll=false;render();break;
    case 'listback':S.listId=null;S.showDone=false;render();break;
    case 'openlist':S.listId=d.id;S.showDone=false;render();window.scrollTo(0,0);break;
    case 'newlist':S.sheet={type:'newlist',pid:d.pid||''};drawLayer();break;
    case 'createlist':{const L=$('#layer'),l=Core.newList(db,L.querySelector('#nl-name').value.trim(),L.querySelector('#nl-pid').value||null,L.querySelector('#nl-tpl').value,Date.now());S.sheet=null;S.listId=l.id;S.tab='proyectos';save();render();window.scrollTo(0,0);break;}
    case 'litog':{const l=listOf(S.listId),i=l&&l.items.find(x=>x.id===d.id);if(i){i.done=!i.done;save();render();}break;}
    case 'lishowdone':S.showDone=!S.showDone;render();break;
    case 'liedit':S.sheet={type:'liitem',id:d.id};drawLayer();break;
    case 'saveitem':{const l=listOf(S.listId),i=l.items.find(x=>x.id===d.id),v=$('#it-text').value.trim();if(v)i.text=v;S.sheet=null;save();render();break;}
    case 'delitem':{const l=listOf(S.listId);l.items=l.items.filter(x=>x.id!==d.id);S.sheet=null;save();render();break;}
    case 'lireset':{const l=listOf(S.listId);l.items.forEach(i=>i.done=false);save();render();toast('Lista lista para usar de nuevo.');break;}
    case 'lishare':shareList(listOf(S.listId));break;
    case 'lisettings':S.sheet={type:'listset',id:S.listId};drawLayer();break;
    case 'savelistset':{const l=listOf(S.listId),L=$('#layer');l.name=L.querySelector('#ls-name').value.trim()||l.name;l.projectId=L.querySelector('#ls-pid').value||null;S.sheet=null;save();render();break;}
    case 'clearDone':{const l=listOf(S.listId);l.items=l.items.filter(i=>!i.done);S.sheet=null;save();render();break;}
    case 'dupelist':{const l=listOf(S.listId),c=Core.newList(db,l.name+' (copia)',l.projectId,'vacia',Date.now());c.items=l.items.map(i=>({id:Core.uid(),text:i.text,done:false}));S.sheet=null;S.listId=c.id;save();render();toast('Duplicada, sin tildes.');break;}
    case 'dellist':S.sheet={type:'confirm',title:'¿Eliminar lista?',text:'La lista se borra con todo lo que tiene.',go:'dodellist',id:S.listId,ok:'Eliminar'};drawLayer();break;
    case 'dodellist':db.lists=db.lists.filter(l=>l.id!==d.id);S.listId=null;S.sheet=null;save();render();break;
    case 'shoplist':{
      const p=projOf(d.pid),miss=Core.stockInfo(db,d.pid).filter(x=>x.missing>0);
      let l=db.lists.find(x=>x.projectId===d.pid&&/^Compras/.test(x.name));
      if(!l)l=Core.newList(db,'Compras: '+p.name,d.pid,'vacia',Date.now());
      let n=0;miss.forEach(x=>{const tag=x.r.name+' — ';if(!l.items.some(i=>i.text.startsWith(tag)&&!i.done)){l.items.push({id:Core.uid(),text:tag+bestUnit(x.missing,x.r.unit),done:false});n++;}});
      S.listId=l.id;save();render();toast(n?`Agregué ${n} a la lista de compras.`:'La lista ya tenía todo.');break;}
    case 'dnew':{const x={id:Core.uid(),name:'',options:[],criteria:[],critComp:{},optComp:{},stage:'name',idx:0,createdAt:Date.now()};db.decisions.push(x);S.dec=x.id;save();render();break;}
    case 'dopen':S.dec=d.id;render();window.scrollTo(0,0);break;
    case 'dexit':{const x=decOf(S.dec);if(x&&x.stage==='name'&&!x.name&&!x.options.length)db.decisions=db.decisions.filter(y=>y.id!==x.id);S.dec=null;save();render();break;}
    case 'dnext':decNext();break;
    case 'dback':decBack();break;
    case 'dans':{const x=decOf(S.dec),sp=Core.ahpSteps(x)[x.idx];Core.ahpSet(x,sp,+d.v);save();render();break;}
    case 'drev':{const x=decOf(S.dec);x.stage='comp';x.idx=Math.max(0,+d.i||0);save();render();window.scrollTo(0,0);break;}
    case 'dshare':decShare(decOf(S.dec));break;
    case 'dinbox':{const x=decOf(S.dec),r=Core.ahpSolve(x);if(addInbox('Hacer: '+x.options[r.order[0]]+' ('+x.name+')')){toast('Anotado en la Bandeja.');}break;}
    case 'ddel':{const x=decOf(d.id);S.sheet={type:'confirm',title:'¿Eliminar decisión?',text:`«${x.name}» se borra con todas sus comparaciones.`,go:'dodeldec',id:d.id,ok:'Eliminar'};drawLayer();break;}
    case 'dodeldec':db.decisions=db.decisions.filter(y=>y.id!==d.id);S.dec=null;S.sheet=null;save();render();break;
    case 'wstart':S.tab='proyectos';S.pid=null;S.wiz={step:'kind',kind:null,name:'',ans:{},when:null,date:'',me:true,people:'',mats:'',budget:'',steps:[],stepsText:'',chain:true,lists:true};render();window.scrollTo(0,0);break;
    case 'wexit':S.wiz=null;render();break;
    case 'wkind':{const k=Core.WIZ_KINDS.find(x=>x.id===d.id);S.wiz.kind=d.id;S.wiz.ans={};S.wiz.name=S.wiz.name||'';S.wiz.step=wizSteps(S.wiz)[1];render();window.scrollTo(0,0);break;}
    case 'wans':S.wiz.ans[d.q]=d.v;wizRead();render();break;
    case 'wwhen':wizRead();S.wiz.when=d.v;render();break;
    case 'wnext':wizNext();break;
    case 'wback':wizBack();break;
    case 'ecoopen':S.sheet={type:'eco'};drawLayer();break;
    case 'ecoapply':{const n=Core.ecoAplicarBloques(db,Core.ecoBloques(ecoRead,todayISO()));S.sheet=null;save();render();toast(n?`Traje ${n} bloque${n===1?'':'s'} protegido${n===1?'':'s'}.`:'No había nada para traer.');break;}
    case 'anevent':{const e=$('#an-date');if(e)e.value=d.d;break;}
    case 'doanchor':{
      const L=$('#layer'),tid=L.querySelector('#an-task').value,dv=L.querySelector('#an-date').value,tv=L.querySelector('#an-time').value||'08:00';
      const target=parseDT(dv,tv);if(!target){toast('Poné la fecha.');break;}
      const r=Core.anchorProject(db,d.id,tid,target);if(!r){toast('No pude calcular esa tarea.');break;}
      S.sheet=null;save();render();
      toast(r.newStart<Date.now()?`Para llegar a esa fecha tendrías que haber empezado el ${fmtDate(r.newStart,false)}. Revisá los plazos.`:`Empieza el ${fmtDate(r.newStart,false)}.`);break;}
    case 'availopen':S.avail=true;render();window.scrollTo(0,0);break;
    case 'availback':S.avail=false;render();break;
    case 'addblk':S.sheet={type:'blk',draft:{id:Core.uid(),label:'',kind:'busy',days:[1,2,3,4,5],start:'08:00',end:'12:00'}};drawLayer();break;
    case 'editblk':S.sheet={type:'blk',id:d.id};drawLayer();break;
    case 'saveblk':{
      const s0=S.sheet,L=$('#layer'),isNew=!s0.id,a=Core.availOf(db),b=isNew?s0.draft:a.blocks.find(x=>x.id===s0.id);
      const st=L.querySelector('#bk-s').value,en=L.querySelector('#bk-e').value,days=[...L.querySelectorAll('#bk-days input:checked')].map(i=>+i.value);
      if(Core.hm(st)==null||Core.hm(en)==null||Core.hm(en)<=Core.hm(st)){toast('Revisá el horario: «hasta» tiene que ser después de «desde».');break;}
      if(!days.length){toast('Elegí al menos un día.');break;}
      b.label=L.querySelector('#bk-name').value.trim()||'Bloque';b.kind=L.querySelector('#bk-kind').value;b.days=days;b.start=st;b.end=en;
      if(isNew)a.blocks.push(b);S.sheet=null;save();render();break;}
    case 'delblk':{const a=Core.availOf(db);a.blocks=a.blocks.filter(x=>x.id!==d.id);S.sheet=null;save();render();break;}
    case 'saveavail':{
      const a=Core.availOf(db),L=$('#app');
      L.querySelectorAll('.capin').forEach(i=>{const v=parseFloat(String(i.value).replace(',','.'));if(i.value===''||isNaN(v))delete a.cap.byDay[i.dataset.wd];else a.cap.byDay[i.dataset.wd]=Math.max(0,v);});
      a.cap.mode=L.querySelector('#av-mode').value;
      const s1=L.querySelector('#av-s').value,e1=L.querySelector('#av-e').value;
      if(Core.hm(s1)!=null&&Core.hm(e1)!=null&&Core.hm(e1)>Core.hm(s1)){a.dayStart=s1;a.dayEnd=e1;}else{toast('El fin del día tiene que ser después del inicio.');break;}
      save();render();toast('Guardado.');break;}
    case 'addexc':{
      const a=Core.availOf(db),k=$('#ex-d').value,v=parseFloat(String($('#ex-h').value).replace(',','.'));
      if(!k||isNaN(v)){toast('Poné la fecha y las horas.');break;}
      a.cap.exc[k]=Math.max(0,v);save();render();break;}
    case 'delexc':{const a=Core.availOf(db);delete a.cap.exc[d.k];save();render();break;}
    case 'addres':S.sheet={type:'res',pid:d.pid,draft:Core.newResource('','persona')};drawLayer();break;
    case 'editres':S.sheet={type:'res',pid:d.pid,id:d.id};drawLayer();break;
    case 'reskind':{
      const s=S.sheet,L=$('#layer'),isNew=!s.id,r=isNew?s.draft:(projOf(s.pid).resources||[]).find(x=>x.id===s.id),nm=L.querySelector('#rs-name').value;
      r.name=nm;r.kind=L.querySelector('#rs-kind').value;if(r.kind==='material'&&!r.unit)r.unit='u';drawLayer();break;}
    case 'saveres':{
      const s=S.sheet,L=$('#layer'),isNew=!s.id,p=projOf(s.pid),r=isNew?s.draft:p.resources.find(x=>x.id===s.id);
      const name=L.querySelector('#rs-name').value.trim();if(!name){toast('Poné un nombre.');break;}
      const num=id=>{const e=L.querySelector(id);return e?(parseFloat(e.value)||0):0;};
      r.name=name;r.kind=L.querySelector('#rs-kind').value;
      if(r.kind==='material'){const uc=L.querySelector('#rs-unitc').value.trim();r.unit=uc||L.querySelector('#rs-unit').value;r.stock=num('#rs-stock');r.price=num('#rs-price');r.rate=0;r.me=false;const eq=num('#rs-eqq'),eu=L.querySelector('#rs-equ').value;r.eq=eq>0&&eu&&eu!==r.unit?{q:eq,u:eu}:null;}
      else{r.rate=num('#rs-rate');const me=L.querySelector('#rs-me');r.me=!!(me&&me.checked);r.unit='';r.stock=0;r.price=0;}
      if(isNew){p.resources=p.resources||[];p.resources.push(r);}
      S.sheet=null;save();render();break;}
    case 'delres':{const r=(projOf(d.pid).resources||[]).find(x=>x.id===d.id);S.sheet={type:'confirm',title:'¿Eliminar recurso?',text:`«${r.name}» se quita del proyecto y de las tareas donde estaba asignado.`,go:'dodelres',id:d.id,pid:d.pid,ok:'Eliminar'};drawLayer();break;}
    case 'dodelres':Core.removeResource(db,S.sheet.pid,d.id);S.sheet=null;save();render();break;
    case 'gzoom':S.gz=d.d==='0'?1:Math.max(0.4,Math.min(8,d.d==='+'?S.gz*1.5:S.gz/1.5));render();break;
    case 'calall':S.calAll=true;S.tab='proyectos';S.pid=null;render();window.scrollTo(0,0);break;
    case 'calback':S.calAll=false;render();break;
    case 'calmode':S.calMode=d.m;render();break;
    case 'calday':S.calDay=+d.ms;render();break;
    case 'calnav':{const n=+d.d,c=new Date(S.calDay==null?startOfToday():S.calDay);
      if(n===0){S.calDay=startOfToday();}
      else if(S.calMode==='mes'){S.calDay=new Date(c.getFullYear(),c.getMonth()+n,1).getTime();}
      else{S.calDay=new Date(c.getFullYear(),c.getMonth(),c.getDate()+7*n).getTime();}
      render();break;}
    case 'collapse':S.collapsed[d.id]=!S.collapsed[d.id];render();break;
    case 'addtask':S.sheet={type:'task',draft:{id:Core.uid(),projectId:S.pid,parentId:null,name:'',durationMin:60,status:'todo',percent:0,preds:[],starred:false,resp:'',notes:'',due:null,createdAt:Date.now()}};drawLayer();break;
    case 'addphase':S.sheet={type:'phase'};drawLayer();break;
    case 'savephase':{const n=$('#ph-name').value.trim();if(!n){toast('Poné un nombre.');break;}db.tasks.push({id:Core.uid(),projectId:S.pid,parentId:null,name:n,durationMin:null,status:'todo',percent:0,preds:[],starred:false,resp:'',notes:'',due:null,createdAt:Date.now()});S.sheet=null;save();render();break;}
    case 'edit':S.sheet={type:'task',id:d.id};drawLayer();break;
    case 'savetask':readTaskForm();break;
    case 'deltask':{const t=taskOf(d.id);S.sheet={type:'confirm',title:'¿Eliminar tarea?',text:`«${t.name}»${Core.hasChildren(db,t)?' y todo lo que contiene':''} se borra y se quita de las dependencias.`,go:'dodeltask',id:d.id,ok:'Eliminar'};drawLayer();break;}
    case 'dodeltask':Core.deleteTask(db,d.id);S.sheet=null;save();render();break;
    case 'splitopen':S.sheet={type:'steps',id:d.id};drawLayer();break;
    case 'dosplit':{
      const steps=parseSteps($('#st-text').value);if(!steps.length){toast('Escribí al menos un paso.');break;}
      if(!db.tasks.find(t=>t.id===d.id).projectId){
        const t=taskOf(d.id),p=Core.makeProject(db,'vacio',t.name,Core.defaultStart(),Date.now());
        t.projectId=p.id;
        S.pid=p.id;S.tab='proyectos';
      }
      Core.splitTask(db,d.id,steps,Date.now());S.sheet=null;save();render();toast('Listo: quedó partida en pasos.');break;
    }
    case 'inboxmenu':S.sheet={type:'inboxmenu',id:d.id};drawLayer();break;
    case 'moveopen':S.sheet={type:'moveto',id:d.id};drawLayer();break;
    case 'domove':{
      const t=taskOf(d.id);
      db.tasks.forEach(x=>{x.preds=(x.preds||[]).filter(p=>!(x.id===t.id||p.id===t.id));});
      t.projectId=d.pid;t.parentId=null;S.sheet=null;save();render();toast('Movida al proyecto.');break;
    }
    case 'toproj':{
      const t=taskOf(d.id),p=Core.makeProject(db,'vacio',t.name,Core.defaultStart(),Date.now());
      Core.deleteTask(db,t.id);S.tab='proyectos';S.pid=p.id;S.sheet=null;save();render();break;
    }
    case 'projset':S.sheet={type:'projset',id:d.id};drawLayer();break;
    case 'saveproj':{
      const p=projOf(d.id),L=$('#layer');
      p.name=L.querySelector('#ps-name').value.trim()||p.name;
      p.start=parseDT(L.querySelector('#ps-date').value,L.querySelector('#ps-time').value)||p.start;
      p.currency=L.querySelector('#ps-cur').value;p.fx=parseFloat(L.querySelector('#ps-fx').value)||1;p.fxDate=parseDateVal(L.querySelector('#ps-fxd').value);
      S.sheet=null;save();render();break;
    }
    case 'delproj':{const p=projOf(d.id);S.sheet={type:'confirm',title:'¿Eliminar proyecto?',text:`«${p.name}» y todas sus tareas se borran.`,go:'dodelproj',id:d.id,ok:'Eliminar'};drawLayer();break;}
    case 'dodelproj':(db.lists||[]).forEach(l=>{if(l.projectId===d.id)l.projectId=null;});db.tasks=db.tasks.filter(t=>t.projectId!==d.id);db.projects=db.projects.filter(p=>p.id!==d.id);S.pid=null;S.sheet=null;save();render();break;
    case 'share':shareProject(d.id);break;
    case 'exportproj':{
      const p=projOf(d.id),sub={v:1,projects:[p],tasks:db.tasks.filter(t=>t.projectId===d.id),meta:{currency:db.meta.currency}};
      download((p.name||'proyecto').replace(/[^\w\-áéíóúñ ]+/gi,'')+'.json',JSON.stringify(sub));break;
    }
    case 'install':if(installEv){installEv.prompt();Promise.resolve(installEv.userChoice).finally(()=>{installEv=null;if(S.tab==='mas')render();});}break;
    case 'goimport':S.tab='mas';S.pid=null;S.sheet=null;render();setTimeout(()=>{const f=$('#f-xml');if(f)f.click();},50);break;
    case 'importjson':{const f=$('#f-json');if(f)f.click();break;}
    case 'exportjson':download('proyectos-copia-'+dateVal(Date.now())+'.json',JSON.stringify(db));break;
    case 'savesettings':db.meta.name=$('#set-name').value.trim();db.meta.currency=$('#set-cur').value;save();toast('Guardado.');break;
    case 'doimport':{
      const mode=document.querySelector('input[name=imode]:checked').value,pa=S.sheet.parsed;
      const res=Core.buildImport(db,pa,{mode,now:Date.now()});
      if(res.pid){S.tab='proyectos';S.pid=res.pid;}else{S.tab='bandeja';S.pid=null;}
      S.sheet={type:'importdone',res};save();render();break;
    }
    case 'confirmrestore':{db=S.sheet.data;normalize();S.sheet=null;S.pid=null;save();render();toast('Copia restaurada.');break;}
  }
}
function normalize(){
  db.projects=db.projects||[];db.tasks=db.tasks||[];db.decisions=db.decisions||[];db.lists=db.lists||[];db.meta=Object.assign({name:'',currency:'ARS',timer:null},db.meta||{});
  db.tasks.forEach(t=>{t.preds=t.preds||[];if(t.parentId===undefined)t.parentId=null;});
}

document.addEventListener('click',e=>{
  const ov=e.target.closest('[data-ov]');
  if(ov&&e.target===ov&&S.sheet){closeSheet();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  act(b.dataset.act,b.dataset,b);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='capture'){const i=$('#capin');if(addInbox(i.value)){render();const n=$('#capin');if(n)n.focus();}}
  else if(f.dataset.form==='listadd'){
    const i=$('#li-in'),l=listOf(S.listId),v=i.value.trim();
    if(l&&v){v.split(/\n|,\s*(?=[A-Za-zÁÉÍÓÚáéíóúñÑ])/).map(x=>x.trim()).filter(Boolean).forEach(x=>l.items.push({id:Core.uid(),text:x,done:false}));save();render();const n=$('#li-in');if(n)n.focus();}
  }
  else if(f.dataset.form==='capsheet'){
    const i=$('#capsheet-in');if(addInbox(i.value)){
      S.sheet.n=(S.sheet.n||0)+1;
      if(S.tab==='bandeja'||S.tab==='hoy'){render();}
      else{i.value='';$('#capcount').textContent='Anotadas: '+S.sheet.n;}
      const n=$('#capsheet-in');if(n){n.value='';n.focus();}
    }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t||!t.id||(t.id!=='tk-qty'&&t.id!=='tk-dur'))return;
  const L=$('#layer'),g=id=>L.querySelector(id);if(!g('#tk-qty'))return;
  const q=parseInt(g('#tk-qty').value,10),dv=parseFloat(g('#tk-dur').value),u=g('#tk-unit').value;
  const per=isNaN(dv)?null:dv*(u==='d'?1440:u==='h'?60:1),tot=g('#tk-total'),w=g('#tk-pu-wrap');
  if(w)w.style.display=q>1?'':'none';
  if(tot)tot.textContent=(q>1&&per!=null)?'Total: '+fmtDur(Math.round(per*q)):'Si es una sola, dejalo vacío. Ej.: 10 min × 15 pelotas = 2 h 30 min.';
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='rs-kind'&&S.sheet&&S.sheet.type==='res'){act('reskind',{},t);return;}
  if(t.id==='f-xml'&&t.files[0]){
    t.files[0].text().then(txt=>{
      try{const pa=Core.parseMSProject(txt);if(!pa.tasks.length)throw new Error('No encontré tareas en el archivo.');S.sheet={type:'import',parsed:pa,mode:pa.suggest};drawLayer();}
      catch(err){toast(err.message||'No pude leer el archivo.');}
      t.value='';
    });
  }
  if(t.id==='f-json'&&t.files[0]){
    t.files[0].text().then(txt=>{
      try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.projects))throw new Error('Ese archivo no es una copia de esta app.');
        S.sheet={type:'confirm',title:'¿Restaurar copia?',text:`Reemplaza lo que hay ahora por ${d.projects.length} proyectos y ${d.tasks.length} tareas de la copia.`,go:'confirmrestore',ok:'Restaurar',data:d};drawLayer();}
      catch(err){toast(err.message||'No pude leer la copia.');}
      t.value='';
    });
  }
});

(async function boot(){
  try{db=await idbGet('db');}catch(e){}
  if(!db){try{const l=localStorage.getItem('proyectos_db');if(l)db=JSON.parse(l);}catch(e){}}
  if(!db)db=Core.newDB();
  normalize();
  if(db.meta.timer&&!taskOf(db.meta.timer.taskId))db.meta.timer=null;
  render();
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist){persisted=(await navigator.storage.persisted())||(await navigator.storage.persist());if(S.tab==='mas'&&!S.sheet)render();}}catch(e){}
})();
})();
</script>
</body>
